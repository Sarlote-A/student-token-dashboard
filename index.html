<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>GLD072 / SLV072 Dashboard</title>
  <style>
    body { font-family: system-ui, sans-serif; max-width: 560px; margin: 2rem auto; padding: 0 16px; color: #222; }
    h1 { font-size: 1.4rem; }
    .card { border: 1px solid #ddd; border-radius: 8px; padding: 1rem; margin: 1rem 0; }
    label { display: block; margin-top: .75rem; font-size: .9rem; }
    input, select, button { width: 100%; padding: .5rem; margin-top: .25rem; box-sizing: border-box; font-size: 1rem; }
    button { cursor: pointer; }
    #warning { background: #fff3cd; border: 1px solid #e0c060; padding: .75rem; border-radius: 6px; display: none; }
    #status { white-space: pre-wrap; word-break: break-all; font-size: .9rem; }
    .err { color: #b00020; } .ok { color: #1b7f3b; }
    code { word-break: break-all; }
  </style>
</head>
<body>
  <h1>GLD072 / SLV072 Token Dashboard</h1>
  <p>Ethereum <strong>Sepolia</strong> testnet only (chain ID 11155111). Test tokens have no monetary value.</p>

  <div id="warning">Wrong network. Please switch MetaMask to Ethereum Sepolia.</div>

  <div class="card">
    <button id="connect">Connect Wallet</button>
    <p>Wallet: <code id="account">not connected</code></p>
    <p>Gold072 (GLD072): <strong id="balA">–</strong></p>
    <p>Silver072 (SLV072): <strong id="balB">–</strong></p>
  </div>

  <div class="card">
    <label>Token
      <select id="token">
        <option value="A">Gold072 (GLD072)</option>
        <option value="B">Silver072 (SLV072)</option>
      </select>
    </label>
    <label>Destination wallet
      <input id="to" placeholder="0x…" autocomplete="off">
    </label>
    <label>Amount (whole tokens, e.g. 1.0)
      <input id="amount" placeholder="1.0" inputmode="decimal" autocomplete="off">
    </label>
    <button id="send" disabled>Send</button>
    <p id="status"></p>
  </div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/ethers/6.13.4/ethers.umd.min.js"></script>
  <script src="app.js"></script>
</body>
</html>
